name: Arduino ESP32 Rework

on:
  push:
    branches: [rework/arduino-esp32]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          arduino-cli version

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Prepare real BareIron sources
        run: python3 tools/prepare_arduino.py

      - name: Compile Arduino sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 arduino/BareIronRework

      - name: Package source and firmware
        run: |
          mkdir -p dist/package
          cp -r arduino/BareIronRework dist/package/
          cp -r arduino/BareIronRework/build dist/package/ 2>/dev/null || true
          cd dist
          zip -r BareIron-Rework-ESP32-Arduino.zip package

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: BareIron-Rework-ESP32-Arduino
          path: dist/BareIron-Rework-ESP32-Arduino.zip
          if-no-files-found: error
