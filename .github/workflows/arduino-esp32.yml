name: Arduino ESP32 Rework

on:
  push:
    branches: [rework/arduino-esp32]
    paths-ignore: ['dist/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          arduino-cli version

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Prepare real BareIron sources
        run: python3 tools/prepare_arduino_v2.py

      - name: Compile Arduino ESP32 Dev Module
        run: arduino-cli compile --export-binaries --fqbn esp32:esp32:esp32 arduino/BareIronRework

      - name: Package sketch and firmware
        run: |
          mkdir -p dist/package
          cp -r arduino/BareIronRework dist/package/source
          find arduino/BareIronRework/build -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.partitions.bin' -o -name '*.bootloader.bin' -o -name '*.map' \) -exec cp {} dist/package/ \;
          cd dist
          zip -r BareIron-Rework-ESP32-Arduino.zip package

      - uses: actions/upload-artifact@v4
        with:
          name: BareIron-Rework-ESP32-Arduino
          path: dist/BareIron-Rework-ESP32-Arduino.zip
          if-no-files-found: error

      - name: Publish verified package to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/BareIron-Rework-ESP32-Arduino.zip
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish verified ESP32 firmware [skip ci]'
          git push
