name: Arduino ESP32 Rework

on:
  push:
    branches: [rework/arduino-esp32]
    paths-ignore: ['dist/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Prepare final source
        run: python3 tools/build_arduino_final.py
      - name: Compile firmware
        run: |
          set +e
          arduino-cli compile --export-binaries --fqbn esp32:esp32:esp32 arduino/BareIronRework 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > build.rc
          mkdir -p dist/debug
          cp build.log build.rc dist/debug/ || true
          cp -r arduino/BareIronRework dist/debug/source || true
          if [ "$rc" -eq 0 ]; then
            mkdir -p dist/final
            cp -r arduino/BareIronRework dist/final/source
            find arduino/BareIronRework -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -exec cp {} dist/final/ \;
            cp build.log dist/final/build.log
            (cd dist/final && zip -r ../BareIron-Rework-ESP32-Arduino.zip .)
          fi
          exit 0
      - name: Publish build result to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git diff --cached --quiet && exit 1
          if [ "$(cat build.rc)" = "0" ]; then
            git commit -m 'build: publish verified ESP32 firmware [skip ci]'
          else
            git commit -m 'build: publish ESP32 build log [skip ci]'
          fi
          git push
      - name: Upload final artifact
        if: ${{ hashFiles('arduino/BareIronRework/*.bin') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BareIron-Rework-ESP32-Arduino
          path: dist/BareIron-Rework-ESP32-Arduino.zip
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BareIron-debug
          path: dist/debug
      - name: Fail on compile error
        run: test "$(cat build.rc)" = "0"
